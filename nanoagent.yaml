_ > nanoagent.plugin.v0001.ManifestConfig:
id: oscar-film-finder
name: Oscar Film Finder
version: 0.3.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_ceremony:
    description: |-
      Read one Academy Awards ceremony's nominations for some awards. Pass a film year from 1928 to 2025 and the awards to read.
      A film year is the year whose films a ceremony honors: 2023 is the 96th Academy Awards, held in 2024.
      Returns {"year", "ceremony", "nominations": [{"award", "film", "nominee", "won"}, ...]}, award by award.
      A nomination naming several films is listed once for each film. An award can have two winners: a tie, or before 1967 a black-and-white and a color award.
      Years outside 1928 to 2025 raise "no ceremony".
  get_film_awards:
    description: |-
      Read a film's nominations for every award, at every ceremony it was nominated at. Pass a title as get_ceremony gives it; case, accents, and spacing are ignored.
      Returns {"title", "films": [{"title", "year", "ceremony", "nominations": [{"award", "nominee", "won"}, ...]}, ...]}, earliest first.
      Films sharing a title, such as remakes, have separate entries, told apart by year.
      A title no film nominated for these awards has raises "no such film".

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  find-films:
    description: |-
      List the Academy Award films of a range of years that won, did not win, or were nominated for but lost given awards.
      Preserve every condition in the user's question. A result with verdict.valid true is the complete, verified answer to that query, including no_matches: no films meet all conditions, not missing data or a failed search.
      After a verified no_matches, report that no films match and stop. Do not run extra searches with removed or reversed conditions to explain or confirm the empty result. Search different conditions only when the user asks for them.
    runner: agent
    tools: [get_ceremony, get_film_awards]
    reference: null
    instructions: |-
      Submit {"status": ..., "films": [{"title": ..., "year": ...}, ...]}. films is [] unless status is found. Check in this order and submit the first status that applies. Make each turn's calls in parallel: turns are limited.
      1. If first_year is after last_year, submit invalid_years. If first_year is before 1928 or last_year after 2025, submit out_of_range. If won and nominated_not_won are both empty, submit no_condition.
      2. Call get_ceremony for every year from first_year to last_year, each with every award in won and nominated_not_won. In each year, group the nominations by film. A film is a candidate if, for every award in won, one of its nominations for it has won true, and, for every award in nominated_not_won, it has a nomination for it and none has won true.
      3. If not_won is empty, keep every candidate. Otherwise call get_film_awards for each candidate's title, and keep a candidate only if, in its entry for that year, no nomination for an award in not_won has won true. A film not nominated for an award did not win it.
      4. Submit found with {"title": the title as get_ceremony gives it, "year": the year} for every film kept, each once. If none is kept, submit no_matches with [].
