_ > nanoagent.plugin.v0001.ManifestConfig:
id: oscar-film-finder
name: Oscar Film Finder
version: 0.4.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_ceremony:
    description: |-
      Read nominations and winners for selected awards in film years 1928–2025. Film year 2023 means the 96th ceremony, held in 2024.
      Returns nominations grouped by award, one entry per named film. Ties and separate black-and-white/color awards can produce multiple winners.
      Out-of-range years raise "no ceremony".
  get_film_awards:
    description: |-
      Read all nominations and wins for a title, earliest ceremony first. Case, accents, and spacing are ignored; years distinguish films sharing a title.
      Unknown titles raise "no such film".

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  find-films:
    description: |-
      Find films by year range and awards won, not won, or nominated for but lost. Preserve all user conditions.
      When verdict.valid is true, no_matches is conclusive: report no matching films and stop. Change conditions only at the user's request.
    runner: agent
    tools: [get_ceremony, get_film_awards]
    reference: null
    instructions: |-
      Submit {"status": ..., "films": [{"title": ..., "year": ...}, ...]}. films is [] unless status is found. Check in this order and submit the first status that applies. Make each turn's calls in parallel: turns are limited.
      1. If first_year is after last_year, submit invalid_years. If first_year is before 1928 or last_year after 2025, submit out_of_range. If won and nominated_not_won are both empty, submit no_condition.
      2. Call get_ceremony for every year from first_year to last_year, each with every award in won and nominated_not_won. In each year, group the nominations by film. A film is a candidate if, for every award in won, one of its nominations for it has won true, and, for every award in nominated_not_won, it has a nomination for it and none has won true.
      3. If not_won is empty, keep every candidate. Otherwise call get_film_awards for each candidate's title, and keep a candidate only if, in its entry for that year, no nomination for an award in not_won has won true. A film not nominated for an award did not win it.
      4. Submit found with {"title": the title as get_ceremony gives it, "year": the year} for every film kept, each once. If none is kept, submit no_matches with [].
